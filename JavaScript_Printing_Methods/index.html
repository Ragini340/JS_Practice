<!DOCTYPE html>
<html lang="en">

<head>

    <title>JavaScript Printing Methods</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

</head>

<body>

    <h3>Demo on Printing Methods</h3>

    <script>

        window.document.write("HTML");

        window.document.writeln("CSS");

        window.console.log("JavaScript");

        window.console.error("Invalid data");

        let a = [10, 20, 30];

        window.console.table(a);

    </script>

</body>

</html>
