<!-- example on JS Arrays -->
<script>
    document.write(`demo on array constructor<br>`);

    // array declaration
    const a = new Array();

    document.write(`size ` + a.length + `<br>`);
    document.write(`array ` + a + `<br>`);

    // assigning values
    a[0] = 12;
    a[1] = 23;
    a[2] = 45;

    document.write(`size ` + a.length + `<br>`);
    document.write(`array ` + a + `<br>`);

    // array with size (5)
    const b = new Array(5);

    // array init
    const c = new Array(10, 20, 30);

    document.write(`size ` + c.length + `<br>`);
    document.write(`array ` + c + `<br>`);
</script>
