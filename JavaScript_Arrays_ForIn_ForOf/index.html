<!-- example on JS Arrays -->
<script>
    document.write(`demo on for in loop<br>`);

    const arr1 = [10, 20, 30, 40];

    for (let i in arr1) {
        document.write(`${i} = ${arr1[i]}<br>`);
    }

    let st1 = "welcome";

    for (let i in st1) {
        document.write(`${i} = ${st1[i]}<br>`);
    }

    document.write(`demo on for of loop<br>`);

    const arr2 = 10;

    for (let e of arr2)
        document.write(`${e} `);

    document.write(`<br>`);

    for (let c of st1) {
        document.write(`${c}<br>`);
    }
</script>
