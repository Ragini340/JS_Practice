<!DOCTYPE html>
<html lang="en">

<head>

    <title>JavaScript Literals</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

</head>

<body>

    <h3>Demo on JavaScript Literals</h3>

    <script>

        // String literal
        document.writeln("Apple");
        document.writeln('Mango');

        // Template literal
        document.writeln(`Orange`);

        // Template literal supports multiple lines
        console.log(`Simla
Green
Apples`);

        // HTML using string literal
        document.write("<h3>Hello World</h3>");

        // Creating input using literal
        document.write(
            '<input type="text" id="username"><br>'
        );

        // Creating image using literal
        document.write(
            '<img src="images/panda.jpg" width="200">'
        );

    </script>

</body>

</html>
