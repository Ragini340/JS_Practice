<!DOCTYPE html>
<html lang="en">

<head>

    <title>Dynamic and Loosely Typed Variables</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

</head>

<body>

    <h3>Demo on Variables</h3>

    <script>

        // Dynamically declared variable
        x = 100;

        document.write(x, "<br>");

        document.write(x * 5, "<br>");


        // Another dynamically declared variable
        st = "ecma";

        document.write(st, "<br>");


        // Loosely typed variable
        let n;

        n = 123;
        document.write(n, "<br>");

        n = 20.66;
        document.write(n, "<br>");

        n = true;
        document.write(n, "<br>");

        n = "JavaScript";
        document.write(n, "<br>");

        n = [11, 22, 33];
        document.write(n, "<br>");

        n = new Date();
        document.write(n, "<br>");

    </script>

</body>

</html>
