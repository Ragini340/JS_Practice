<!-- 28 - DOM Implementation: Button Counter -->

<!DOCTYPE html>
<html lang="en">

<head>
    <title>DOM</title>

    <link rel="icon" href="logo.png" />

    <style>
        .container {
            display: inline-block;
            border: 2px solid black;
        }

        button,
        input {
            text-align: center;
            width: 50px;
            outline: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Button Counter (Quantity)</h2>

    <div class="container">

        <button type="button" id="decreBt">-</button>

        <input type="text" id="qty" value="0" readonly />

        <button type="button" id="increBt">+</button>

    </div>

    <script>
        // Getting objects
        const qt = document.querySelector("#qty");
        const iBt = document.querySelector("#increBt");
        const dBt = document.querySelector("#decreBt");


        // Decrement button logic
        dBt.onclick = function() {
            qt.value--;
        };


        // Increment button logic
        iBt.onclick = function() {
            qt.value++;
        };
    </script>

</body>
</html>
