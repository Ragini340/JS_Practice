<!DOCTYPE html>
<html lang="en">

<head>

    <title>JavaScript Non-Primitive Data Types</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

</head>

<body>

    <h3>Demo on Non-Primitive Data Types</h3>

    <script>

        // Date object
        var d1 = new Date();

        // Date object with specific date
        let d2 = new Date("30-Aug-2026");

        // Array
        const a = [10, 20, 30];


        document.write(d1, "<br>");

        document.write(d2, "<br>");

        document.write(a, "<br>");

    </script>

</body>

</html>
