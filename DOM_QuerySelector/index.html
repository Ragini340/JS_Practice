<!-- 21 - DOM: querySelector() and querySelectorAll() -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM</title>

    <style>
        #id1 {
            color: red;
        }

        .c1 {
            color: blue;
        }
    </style>
</head>

<body>

    <h3>Demo on document object methods</h3>

    <h1 id="id1">Apple</h1>

    <p class="c1">Banana</p>
    <span class="c1">Orange</span>
    <div class="c1">Mango</div>

    <hr>

    <script>
        // Returns h1 tag object reference
        const ob = document.querySelector("#id1");
        document.write(ob, `<br>`);

        // Returns first element having class c1
        const ob2 = document.querySelector(".c1");
        document.write(ob2, `<br>`);

        // Returns collection with all elements having class c1
        const ob3 = document.querySelectorAll(".c1");
        document.write(ob3, `<br>`);
    </script>

</body>
</html>
