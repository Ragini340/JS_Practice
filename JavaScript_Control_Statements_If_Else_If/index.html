<!-- example on JS Control Statements -->
<script>document.write(`demo on if else if<br>`);

  /** finding biggest of 2 numbers **/
  let x = +prompt("enter first number");
  let y = +prompt("enter second number");

  if(x > y)
    document.write(`First is Big`);
  else if(y > x)
    document.write(`Second is Big`);
  else
    document.write(`No one is Big`);</script>
