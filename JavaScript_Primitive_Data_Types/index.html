<!DOCTYPE html>
<html lang="en">

<head>

    <title>JavaScript Primitive Data Types</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

</head>

<body>

    <h3>Demo on Primitive Data Types</h3>

    <script>

        var a = 100;             // Number

        var b = 20.56;           // Number

        let c = 11n;             // BigInt

        const D = true;          // Boolean

        let e;                   // Undefined

        var f = "JavaScript";    // String

        let g = null;            // Null


        document.write(a, " => ", typeof a, "<br>");

        document.write(b, " => ", typeof b, "<br>");

        document.write(c, " => ", typeof c, "<br>");

        document.write(D, " => ", typeof D, "<br>");

        document.write(e, " => ", typeof e, "<br>");

        document.write(f, " => ", typeof f, "<br>");

        document.write(g, " => ", typeof g, "<br>");

    </script>

</body>

</html>
