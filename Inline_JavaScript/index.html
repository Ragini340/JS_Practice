<!DOCTYPE html>
<html lang="en">

<head>
    <title>Inline JavaScript</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body id="body">

    <h2>Demo on Inline JavaScript</h2>

    <button type="button"
            onclick="alert('Hey, you pushed me')">
        Push Here
    </button>

    <br><br>

    <button type="button"
            onclick="alert('Hey, why you pulled me')">
        Pull Here
    </button>

    <br><br>

    <h2 id="heading"
        onmouseover="heading.textContent='Backend Tech'"
        onmouseout="heading.textContent='Frontend Tech'">
        Frontend Tech
    </h2>

    <input type="color"
           id="color"
           oninput="body.style.backgroundColor=color.value">

</body>

</html>
