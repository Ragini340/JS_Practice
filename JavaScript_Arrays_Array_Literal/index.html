<!-- example on JS Arrays -->
<script>
    document.write(`demo on array literal<br>`);

    // array declaration
    const a = [];

    document.writeln(`size ` + a.length + `<br>`);
    document.writeln(`array ` + a + `<br>`);

    // assigning values
    a[0] = 10;
    a[1] = 20;
    a[2] = 39;

    document.writeln(`size ` + a.length + `<br>`);
    document.writeln(`array ` + a + `<br>`);

    // array init
    const b = [5];  // 5 is value

    // array init
    const c = [11, 22, 33, 44];

    document.writeln(`size ` + c.length + `<br>`);
    document.writeln(`array ` + c + `<br>`);
</script>
