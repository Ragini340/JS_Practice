<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>DOM</title>

</head>

<body>

    <h3>Demo on Document Object Methods</h3>

    <h1 id="heading">Hello World</h1>

    <input type="radio"
           id="r1"
           name="color">

    <label>Red</label>

    &nbsp;

    <input type="radio"
           id="r2"
           name="color">

    <label>Green</label>

    &nbsp;

    <input type="radio"
           id="r3"
           name="color">

    <label>Blue</label>

    <hr>

    <script>

        // Get element by ID
        let hob = document.getElementById("heading");

        document.write(`${hob}<br>`);


        // Get elements by name
        const rob = document.getElementsByName("color");

        document.write(`${rob}<br>`);

    </script>

</body>

</html>
